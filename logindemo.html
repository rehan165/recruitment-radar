<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecruitmentRadar | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('image1.jpg') no-repeat center center fixed; 
            background-size: cover; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card bg-dark text-white login-card">
                    <div class="card-header bg-danger text-center py-3 border-0 rounded-top">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock me-2"></i>Account Login</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label text-light small fw-bold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-secondary border-0 text-white"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" name="txtuname" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-light small fw-bold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-secondary border-0 text-white"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" name="txtpass" placeholder="••••••••" required>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" id="loginBtn" class="btn btn-danger py-2 fw-semibold">Sign In</button>
                                <a href="employeereg.html" class="btn btn-outline-light btn-sm mt-2">Don't have an account? Register</a>
                                <a href="index.html" class="btn btn-link text-white-50 text-decoration-none small text-center">&larr; Return to Homepage</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            let email = document.querySelector('input[name="txtuname"]').value.trim();
            let pass = document.querySelector('input[name="txtpass"]').value;
            let loginBtn = document.getElementById('loginBtn');

            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';
            loginBtn.disabled = true;

            try {
                const res = await fetch('http://localhost:5000/api/login', ... {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pass })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('active_user', data.name);
                    window.location.href = "user_dashboard.html";
                } else {
                    alert(data.message || "Invalid credentials.");
                    loginBtn.innerHTML = 'Sign In';
                    loginBtn.disabled = false;
                }
            } catch (err) {
                alert("Could not connect to backend server. Make sure 'node server.js' is running in your terminal.");
                loginBtn.innerHTML = 'Sign In';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
