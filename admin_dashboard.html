<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - RecruitmentRadar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-danger shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Radar Admin Panel</a>
            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm">Return Home</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">System Overview</h2>
        
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Registered Candidates</h5>
                        <h2 class="display-4 fw-bold" id="candidateCount">...</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Active Job Postings</h5>
                        <h2 class="display-4 fw-bold">4</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Pending Reviews</h5>
                        <h2 class="display-4 fw-bold" id="pendingCount">...</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Candidate Database</h5>
                <span class="badge bg-danger">Live MongoDB Sync</span>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Date Registered</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="candidateTableBody">
                        <tr><td colspan="4" class="text-center py-3">Loading Database...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('/api/candidates');
                const candidates = await res.json();

                document.getElementById('candidateCount').innerText = candidates.length;
                document.getElementById('pendingCount').innerText = Math.max(1, Math.floor(candidates.length / 2));

                let tbody = document.getElementById('candidateTableBody');
                tbody.innerHTML = '';

                if (candidates.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3">No candidates registered yet.</td></tr>';
                    return;
                }

                candidates.forEach((c, index) => {
                    let formattedDate = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : 'Today';
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-semibold">${c.name}</td>
                            <td>${c.email}</td>
                            <td>${formattedDate}</td>
                            <td><span class="badge ${index === 0 ? 'bg-success' : 'bg-warning text-dark'}">${index === 0 ? 'Verified' : 'Pending'}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Backend error:", error);
                document.getElementById('candidateTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger py-3">Failed to load database. Ensure Node server is running.</td></tr>';
            }
        }

        loadAdminData();
    </script>
</body>
</html>
